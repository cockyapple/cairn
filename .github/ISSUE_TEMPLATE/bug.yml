name: Bug report
description: Something in the code or spec is wrong
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Security vulnerabilities go through the private reporting flow in SECURITY.md, not here.
  - type: textarea
    id: what
    attributes: {label: What happened, description: Include the input, expected result and actual result}
    validations: {required: true}
  - type: input
    id: version
    attributes: {label: Commit or version}
