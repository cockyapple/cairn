name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - name: vet
        run: go vet ./...
      - name: test
        run: go test -count=1 -race ./...
      - name: vectors are current
        run: |
          go run ./cmd/cairn-vectors > /tmp/v.json
          diff -u testdata/vectors-v1.json /tmp/v.json
      - name: no third-party dependencies
        run: |
          test "$(grep -c . go.mod)" -le 4 && ! test -e go.sum
          bad=$(go list -deps -test ./... | grep -v '^github.com/cockyapple/cairn' | grep -v '^vendor/' | grep '^[^/]*\.' || true)
          test -z "$bad" || { echo "non-standard-library imports:"; echo "$bad"; exit 1; }
      - name: verifier size budget
        run: test "$(ls wire/*.go ledger/*.go | grep -v _test.go | xargs cat | wc -l)" -le 1500
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: fuzz every target for 20 seconds
        run: |
          for t in ledger:FuzzDecodeEntry ledger:FuzzDecodeSignedCheckpoint ledger:FuzzDecodeTrustConfig ledger:FuzzDecodePayloads ledger:FuzzProofs logserver:FuzzAppend note:FuzzVerify; do
            go test -run '^$' -fuzz "^${t#*:}\$" -fuzztime 20s -parallel 2 "./${t%%:*}"
          done
  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: every mutant in testdata/mutants.json is killed or declared equivalent
        run: go run ./internal/mutate -j 2
